[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpl-benchmark"
version = "1.0.0"
description = "BPL-v1.0: score agents that sit inside a company for a long session and still have to obey the business"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ClaySeal" }]
requires-python = ">=3.10,<3.14"
keywords = [
  "llm",
  "agents",
  "benchmark",
  "ai-safety",
  "tool-use",
  "evaluation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["openai>=1.40"]
dev = ["pytest>=8.0", "bpl-benchmark[live]"]

[project.urls]
Homepage = "https://github.com/clayseal/bpl-benchmark"
Repository = "https://github.com/clayseal/bpl-benchmark"
Issues = "https://github.com/clayseal/bpl-benchmark/issues"

[project.scripts]
bpl-live = "benchmarks.live.bpl_live:main"

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]

[tool.pytest.ini_options]
testpaths = ["benchmarks/tests"]
pythonpath = ["."]
addopts = "-q"
